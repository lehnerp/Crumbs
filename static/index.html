<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crumbs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='9' cy='20' r='5' fill='%23f2c94c'/><circle cx='20' cy='12' r='3.5' fill='%23f2c94c' opacity='.7'/><circle cx='26' cy='24' r='2.5' fill='%23f2c94c' opacity='.45'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>try { if (localStorage.getItem('crumbs-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="20" r="5" fill="var(--accent)"/><circle cx="20" cy="12" r="3.5" fill="var(--accent)" opacity=".7"/><circle cx="26" cy="24" r="2.5" fill="var(--accent)" opacity=".45"/></svg>
    Crumbs
  </div>
  <form id="searchForm" class="search" autocomplete="off">
    <div class="qwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search every line of every file" spellcheck="false" aria-label="Search text">
      <kbd>/</kbd>
    </div>
    <div class="seg" role="group" aria-label="Match mode">
      <button type="button" data-mode="substring" aria-pressed="true" title="Case-insensitive substring">Contains</button>
      <button type="button" data-mode="case" aria-pressed="false" title="Case-sensitive substring">Match case</button>
      <button type="button" data-mode="regex" aria-pressed="false" title="Python regular expression, prefix (?i) to ignore case">Regex</button>
      <button type="button" data-mode="query" aria-pressed="false" title='All words in any order, "exact phrase", OR, -exclude, file: ext: after: before: rule: sev: cat: has:'>Boolean</button>
    </div>
    <button type="button" class="btn" id="filtersBtn" aria-expanded="false">Filters</button>
    <button type="submit" class="btn primary">Search</button>
  </form>
  <button class="chip-status" id="indexChip" title="Index status"><span class="dot"></span><span id="indexText">Loading</span></button>
</header>

<div class="filters" id="filters" hidden>
  <label class="field">File types<input id="fExt" placeholder=".log, .json, .csv" size="16"></label>
  <label class="field">Path contains<input id="fPath" placeholder="auth/ or server01" size="18"></label>
  <label class="field">From<input id="fFrom" type="datetime-local"></label>
  <label class="field">To<input id="fTo" type="datetime-local"></label>
  <button type="button" class="btn small ghost" id="fClear">Clear filters</button>
  <span class="faint" style="font-size:12.5px">Time filters only match lines with a detected timestamp.</span>
</div>

<div class="layout">
  <nav class="rail" aria-label="Sections">
    <button data-view="overview">Overview</button>
    <button data-view="search">Search<span class="count" id="cSearch"></span></button>
    <button data-view="files">Files<span class="count" id="cFiles"></span></button>
    <button data-view="triage">Triage<span class="count" id="cTriage"></span></button>
    <button data-view="findings">Findings<span class="count" id="cFindings"></span></button>
    <button data-view="entities">Entities<span class="count" id="cEntities"></span></button>
    <button data-view="host">Host<span class="count" id="cHost"></span></button>
    <button data-view="episodes">Episodes<span class="count" id="cEpisodes"></span></button>
    <button data-view="fs">Filesystem<span class="count" id="cFs"></span></button>
    <button data-view="tamper">Tampering<span class="count" id="cTamper"></span></button>
    <button data-view="timeline">Timeline</button>
    <button data-view="graph">Graph</button>
    <button data-view="board">Evidence board<span class="count" id="cPins"></span></button>
    <button data-view="tools">Tools<span class="count" id="cTools"></span></button>
    <div class="spacer"></div>
    <button data-view="settings">Settings &amp; keys</button>
    <button data-view="index">Index settings</button>
    <button id="themeBtn" type="button">Light theme</button>
  </nav>
  <main id="main">
    <section class="view" id="v-overview" hidden></section>
    <section class="view" id="v-search" hidden></section>
    <section class="view" id="v-files" hidden></section>
    <section class="view" id="v-triage" hidden></section>
    <section class="view" id="v-findings" hidden></section>
    <section class="view" id="v-entities" hidden></section>
    <section class="view" id="v-host" hidden></section>
    <section class="view" id="v-episodes" hidden></section>
    <section class="view" id="v-fs" hidden></section>
    <section class="view" id="v-tamper" hidden></section>
    <section class="view" id="v-timeline" hidden></section>
    <section class="view" id="v-graph" hidden></section>
    <section class="view" id="v-board" hidden></section>
    <section class="view" id="v-tools" hidden></section>
    <section class="view" id="v-settings" hidden></section>
    <section class="view" id="v-index" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="viewer" id="viewer" hidden aria-label="File viewer">
  <div class="vhead">
    <div class="vtitle">
      <span class="path" id="vPath"></span>
      <button class="btn small ghost" id="vClose" title="Close (Esc)">Close</button>
    </div>
    <div class="vmeta" id="vMeta"></div>
    <div class="vtools">
      <input class="input" id="vFind" placeholder="Find in this file" spellcheck="false" aria-label="Find in file">
      <button class="btn small" id="vPrev" title="Previous match (Shift+Enter)">Prev</button>
      <button class="btn small" id="vNext" title="Next match (Enter)">Next</button>
      <span class="muted" id="vFindInfo" style="font-size:13px"></span>
      <span class="grow"></span>
      <input class="input goto" id="vGoto" type="number" min="1" placeholder="Line" aria-label="Go to line">
      <button class="btn small" id="vTimes" aria-pressed="true" title="Show when each line was written">Times</button>
      <button class="btn small" id="vWrap" aria-pressed="true">Wrap</button>
      <a class="btn small" id="vRaw" href="#">Download original</a>
    </div>
  </div>
  <div class="vbody">
    <div class="code wrap" id="vCode" tabindex="0"></div>
    <div class="vside">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabF" aria-selected="true">Findings</button>
        <button role="tab" id="tabE" aria-selected="false">Entities</button>
        <button role="tab" id="tabI" aria-selected="false">Integrity</button>
        <button role="tab" id="tabL" aria-selected="false">Line</button>
      </div>
      <div id="vSide"></div>
    </div>
  </div>
</aside>
<div class="toast" id="toast" hidden></div>

<!-- Graph library: uses static/vendor/cytoscape.min.js if present (offline), otherwise the CDN -->
<script src="/static/vendor/cytoscape.min.js" onerror="this.remove()"></script>
<script>
  if (!window.cytoscape) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"><\/script>');
</script>
<script src="/static/app.js"></script>
</body>
</html>
